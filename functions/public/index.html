<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa - Discover Amazing Places</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Mesa - Discover Amazing Places">
    <meta property="og:description" content="Join Mesa to discover and share the best places around you.">
    <meta property="og:image" content="https://mesa-backend-production.up.railway.app/images/mesa-logo-og.png">
    <meta property="og:url" content="https://mesa-backend-production.up.railway.app">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mesa">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mesa - Discover Amazing Places">
    <meta name="twitter:description" content="Join Mesa to discover and share the best places around you.">
    <meta name="twitter:image" content="https://mesa-backend-production.up.railway.app/static/images/mesa-logo.png">
    <meta name="twitter:site" content="@mesaapp">
    
    <!-- App Store Links -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID">
    

    
    <!-- Additional Meta Tags for Better Preview Cards -->
    <meta name="theme-color" content="#667eea">
    <meta name="msapplication-TileColor" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .logo img {
            width: 80px;
            height: 80px;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .download-btn {
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-block;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
        }
        
        .content-preview {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .content-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .content-description {
            opacity: 0.8;
            margin-bottom: 1rem;
        }
        
        .content-meta {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .deep-link-section {
            margin-top: 1rem;
        }
        
        .open-app-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
            transition: background 0.2s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .open-app-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .content-image {
            margin-bottom: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .content-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://mesa-backend-production.up.railway.app/static/images/mesa-logo.png" alt="Mesa Logo">
        </div>
        
        <h1>Mesa</h1>
        <p>Discover and share amazing places with friends</p>
        
        <div class="content-preview" id="content-preview">
            <!-- Dynamic content will be inserted here -->
        </div>
        
        <a href="https://apps.apple.com/app/mesa/id/YOUR_APP_ID" class="download-btn">
            Download Mesa
        </a>
        
        <div class="deep-link-section" id="deep-link-section" style="display: none;">
            <a href="#" class="open-app-btn" id="open-app-btn">
                Open in Mesa
            </a>
        </div>
    </div>
    
    <script>
        // Parse URL parameters to get content details
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const id = urlParams.get('id');
        
        // Generate deep link URL
        function generateDeepLink() {
            if (type === 'place') {
                const name = urlParams.get('name') || '';
                const address = urlParams.get('address') || '';
                const city = urlParams.get('city') || '';
                const mapboxId = urlParams.get('mapboxId') || '';
                const lat = urlParams.get('lat') || '';
                const lng = urlParams.get('lng') || '';
                
                let deepLink = `loc://place/${id}?name=${encodeURIComponent(name)}`;
                if (address) deepLink += `&address=${encodeURIComponent(address)}`;
                if (city) deepLink += `&city=${encodeURIComponent(city)}`;
                if (mapboxId) deepLink += `&mapboxId=${encodeURIComponent(mapboxId)}`;
                if (lat) deepLink += `&lat=${encodeURIComponent(lat)}`;
                if (lng) deepLink += `&lng=${encodeURIComponent(lng)}`;
                
                return deepLink;
            } else if (type === 'list') {
                const name = urlParams.get('name') || '';
                const city = urlParams.get('city') || '';
                const userId = urlParams.get('userId') || '';
                
                let deepLink = `loc://list/${id}?name=${encodeURIComponent(name)}`;
                if (city) deepLink += `&city=${encodeURIComponent(city)}`;
                if (userId) deepLink += `&userId=${encodeURIComponent(userId)}`;
                
                return deepLink;
            }
            return null;
        }
        
        // Update meta tags based on content type
        function updateMetaTags(title, description, image) {
            document.title = title;
            
            // Update Open Graph tags
            document.querySelector('meta[property="og:title"]').setAttribute('content', title);
            document.querySelector('meta[property="og:description"]').setAttribute('content', description);
            document.querySelector('meta[property="og:image"]').setAttribute('content', image);
            document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
            
            // Update Twitter Card tags
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', image);
        }
        
        // Update content preview based on type
        function updateContentPreview() {
            const previewDiv = document.getElementById('content-preview');
            
            if (type === 'place') {
                const name = urlParams.get('name') || 'Amazing Place';
                const address = urlParams.get('address') || '';
                const city = urlParams.get('city') || '';
                const imageUrl = urlParams.get('image') || '';
                
                const title = `📍 ${name}`;
                const description = address ? `${address}${city ? `, ${city}` : ''}` : 'Check out this place on Mesa!';
                
                updateMetaTags(
                    `${name} on Mesa`,
                    description,
                    imageUrl || 'https://mesa-backend-production.up.railway.app/static/images/mesa-logo.png'
                );
                
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `
                        <div class="content-image">
                            <img src="${imageUrl}" alt="${name}" onerror="this.style.display='none'">
                        </div>
                    `;
                }
                
                previewDiv.innerHTML = `
                    ${imageHtml}
                    <div class="content-title">${title}</div>
                    <div class="content-description">${description}</div>
                    <div class="content-meta">Shared on Mesa</div>
                `;
            } else if (type === 'list') {
                const name = urlParams.get('name') || 'Amazing List';
                const city = urlParams.get('city') || '';
                const userId = urlParams.get('userId') || '';
                const imageUrl = urlParams.get('image') || '';
                
                const title = `📋 ${name}`;
                const description = city ? `A curated list of places in ${city}` : 'A curated list of amazing places';
                
                updateMetaTags(
                    `${name} - Mesa List`,
                    description,
                    imageUrl || 'https://mesa-backend-production.up.railway.app/static/images/mesa-logo.png'
                );
                
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `
                        <div class="content-image">
                            <img src="${imageUrl}" alt="${name}" onerror="this.style.display='none'">
                        </div>
                    `;
                }
                
                previewDiv.innerHTML = `
                    ${imageHtml}
                    <div class="content-title">${title}</div>
                    <div class="content-description">${description}</div>
                    <div class="content-meta">Shared on Mesa</div>
                `;
            } else {
                // Default Mesa preview
                updateMetaTags(
                    'Mesa - Discover Amazing Places',
                    'Join Mesa to discover and share the best places around you.',
                    'https://mesa-backend-production.up.railway.app/static/images/mesa-logo.png'
                );
                
                previewDiv.innerHTML = `
                    <div class="content-title">Welcome to Mesa</div>
                    <div class="content-description">Discover and share amazing places with friends</div>
                    <div class="content-meta">Download the app to get started</div>
                `;
            }
        }
        
        // Auto-redirect to app if possible
        function redirectToApp() {
            const deepLink = generateDeepLink();
            if (deepLink) {
                // Try to open the app
                window.location.href = deepLink;
                
                // Fallback to App Store after a short delay
                setTimeout(function() {
                    if (!document.hidden) {
                        window.location.href = 'https://apps.apple.com/app/mesa/id/YOUR_APP_ID';
                    }
                }, 1000);
            }
        }
        
        // Initialize the page and redirect immediately
        updateContentPreview();
        redirectToApp();
    </script>
</body>
</html>
