name: Cert maintenance
on:
  push:
    branches: [ci/cert-maintenance]
jobs:
  certs:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_PATH: /tmp/asc/AuthKey.p8
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography
      - name: Write key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: mkdir -p /tmp/asc && echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
      - name: Run
        run: python3 ci/asc_certs.py $(cat ci/cert-action.txt)
      - if: always()
        run: rm -rf /tmp/asc
