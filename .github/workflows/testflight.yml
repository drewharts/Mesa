name: TestFlight

on:
  push:
    branches: [testflight]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # Release gate: lint, structure, version and unit-tests (checks.yml) must pass before upload.
  # ui-smoke is non-blocking and skipped here; it still runs on feature/** pushes.
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
    with:
      include_ui_smoke: false

  upload:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: loc
      PROJECT: loc.xcodeproj
      ARCHIVE_PATH: /tmp/mesa-ci/loc.xcarchive
      EXPORT_PATH: /tmp/mesa-ci/export
      ASC_KEY_PATH: /tmp/mesa-ci/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Prepare temp dir
        run: mkdir -p /tmp/mesa-ci

      - name: Write Secrets.xcconfig
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: printf 'GMS_API_KEY = %s\nPOSTHOG_API_KEY = %s\n' "$GMS_API_KEY" "$POSTHOG_API_KEY" > Secrets.xcconfig

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"

      - name: Import distribution certificate
        # One reusable Apple Distribution cert (secrets DIST_CERT_*), so CI never
        # creates a new Apple Development certificate per run.
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN=/tmp/mesa-ci/ci.keychain-db
          KC_PW=$(openssl rand -hex 16)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > /tmp/mesa-ci/dist.p12
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import /tmp/mesa-ci/dist.p12 -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/mesa-ci/dist.p12
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution"

      - name: Install App Store provisioning profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DIST_CERT_ID: 5483KTU7R3
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install -q pyjwt cryptography
          OUT="$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 ci/asc_certs.py ensure-profile "Mesa CI AppStore" drewharts.locc "$DIST_CERT_ID" "$OUT"
          python3 ci/asc_certs.py ensure-profile "Mesa CI AppStore Share" drewharts.locc.MesaShare "$DIST_CERT_ID" "$OUT"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$OUT"/*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"

      - name: Compute build number
        # Offset keeps CI builds above any build number already uploaded by hand.
        run: echo "BUILD_NUMBER=$(( ${{ vars.BUILD_NUMBER_OFFSET || 1000 }} + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          python3 ci/use_distribution_identity.py
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM=585YK2F2H6 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MESA_API_BASE_URL=https://mesa-backend-staging.up.railway.app > /tmp/mesa-ci/archive.log 2>&1 \
            || { echo "=== compiler errors ==="; grep -aE "\.swift:[0-9]+:[0-9]+: error|: error:|error: " /tmp/mesa-ci/archive.log | sort -u | head -40; tail -n 5 /tmp/mesa-ci/archive.log; exit 1; }

      - name: Guard - no UI-test email login in the Release binary
        # The DEBUG-only email sign-in is keyed on this launch argument; it must never ship.
        run: |
          APP=$(ls -d "$ARCHIVE_PATH"/Products/Applications/*.app | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found in archive"; exit 1; }
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          [ -f "$BIN" ] || { echo "::error::app binary not found"; exit 1; }
          FILES=("$BIN")
          while IFS= read -r f; do FILES+=("$f"); done < <(find "$APP" -name '*.debug.dylib' 2>/dev/null)
          for f in "${FILES[@]}"; do
            if strings -a "$f" | grep -q MesaUITestEmailLogin; then
              echo "::error::MesaUITestEmailLogin found in $(basename "$f"): test-only login leaked into Release"
              exit 1
            fi
          done
          echo "OK: MesaUITestEmailLogin not present in ${#FILES[@]} binary file(s)"

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ci/ExportOptionsManual.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf "$ASC_KEY_PATH" Secrets.xcconfig /tmp/mesa-ci/dist.p12
          security delete-keychain /tmp/mesa-ci/ci.keychain-db 2>/dev/null || true
